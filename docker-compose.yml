services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_superuser_dev}
      POSTGRES_DB: postgres
      STORE_DB_PASSWORD: ${STORE_DB_PASSWORD:-local_dev_store_password}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      WEB_STORE_PASSWORD: ${WEB_STORE_PASSWORD:-web_store_pass}
    volumes:
      - boudica_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # host 5433 -> avoids clashing with a local postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      STORE_DB_PASSWORD: ${STORE_DB_PASSWORD:-local_dev_store_password}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # Defaults to this LAN's real running Boudica AI inference deployment.
      BOUDICA_HOST: ${BOUDICA_HOST:-192.168.0.131}
      BOUDICA_PORT: ${BOUDICA_PORT:-80}
      BOUDICA_API_KEY: ${BOUDICA_API_KEY:-}
    healthcheck:
      # Every command now requires real credentials (the old no-credentials-needed
      # fallback was a security bug, removed — see CODE_VERIFIED_AUDIT.md) so this uses the
      # seeded admin login, which also means it genuinely exercises auth + the DB round trip.
      test: ["CMD", "curl", "-sf", "http://localhost/cgi-bin/boudica_pos?command=getsupplierlist&username=admin&password=${ADMIN_PASSWORD:-AdminPassword123!}", "-o", "/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  boudica_pg_data:
