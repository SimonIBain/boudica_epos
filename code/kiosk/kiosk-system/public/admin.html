<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kiosk Admin Studio</title>
    <!-- Core External Visual Framework Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/grapesjs@0.21.13/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs@0.21.13/dist/grapes.min.js"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage@1.0.3/dist/index.js"></script>
    <style>
        body, html { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
        #top-bar { position: absolute; top: 0; left: 0; right: 0; height: 50px; background: #2c3e50; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 999; }
        #gjs { top: 50px; height: calc(100% - 50px); }
        .btn { background: #27ae60; color: white; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #219a52; }
        select { padding: 6px; border-radius: 4px; border: none; font-size: 14px; margin-left: 10px; background: white; color: #333; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div>
            <label><b>Kiosk Style Presets:</b></label>
            <select id="theme-selector" onchange="applyPredefinedTheme()">
                <option value="modern-dark">Modern Dark Mode</option>
                <option value="clean-light">Clean Corporate Light</option>
                <option value="eco-green">Eco Retail Green</option>
            </select>
        </div>
        <button class="btn" onclick="saveKioskLayout()">Save & Publish Layout</button>
    </div>

    <!-- The root anchor point where GrapesJS boots -->
    <div id="gjs"></div>

    <script>
        // Initialize the drag-and-drop workspace layout preset
        const editor = grapesjs.init({
            container: '#gjs',
            fromElement: true,
            height: '100%',
            storageManager: false, // Override internal cache database, run via native Node server 
            plugins: ['gjs-preset-webpage']
        });

        // Dictionary containing structural styling properties applied directly across the frame components
        const styleThemes = {
            'modern-dark': `.kiosk-body { background-color: #121212; color: #ffffff; min-height: 100vh; transition: all 0.3s; }\n.ai-box { background: #1e1e1e; border: 1px solid #333; color: #fff; padding: 25px; border-radius: 12px; }\n.chat-log { background: #252525; border: 1px solid #444; height: 300px; padding: 15px; border-radius: 8px; overflow-y: auto; }`,
            'clean-light': `.kiosk-body { background-color: #f8f9fa; color: #212529; min-height: 100vh; transition: all 0.3s; }\n.ai-box { background: #ffffff; border: 1px solid #dee2e6; color: #212529; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }\n.chat-log { background: #f1f3f5; border: 1px solid #ced4da; height: 300px; padding: 15px; border-radius: 8px; overflow-y: auto; }`,
            'eco-green': `.kiosk-body { background-color: #f4f7f5; color: #2c3e50; min-height: 100vh; transition: all 0.3s; }\n.ai-box { background: #ffffff; border: 2px solid #27ae60; color: #2c3e50; padding: 25px; border-radius: 12px; }\n.chat-log { background: #e8f5e9; border: 1px solid #c8e6c9; height: 300px; padding: 15px; border-radius: 8px; overflow-y: auto; }`
        };

        function applyPredefinedTheme() {
            const chosen = document.getElementById('theme-selector').value;
            editor.setStyle(styleThemes[chosen]);
        }

        // Define a custom, immutable UI component container mapping to the Boudica API
        editor.BlockManager.add('boudica-chat-block', {
            label: '<b>Boudica Chat Element</b>',
            content: `<div class="kiosk-body">
                        <div class="ai-box" style="max-width:550px; margin: 40px auto;">
                            <h3 style="margin-top:0; font-size: 22px;">Sovereign AI Terminal</h3>
                            <div class="chat-log">
                                <div style="color: #888; font-style: italic;">Ask questions regarding inventory stock levels, store locations, or device service packages...</div>
                            </div>
                            <div style="display:flex; gap:10px; margin-top:15px;">
                                <input type="text" class="chat-input" placeholder="Query model..." style="flex-grow:1; padding:12px; border-radius:6px; border:1px solid #ccc; font-size:15px;">
                                <button class="chat-submit-btn" style="padding:12px 24px; background:#2980b9; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Send</button>
                            </div>
                        </div>
                      </div>`,
            category: 'Store Modules'
        });

        // Pull and initialize canvas elements on initial execution
        fetch('/api/load-layout')
            .then(res => res.json())
            .then(data => {
                if(data.html) editor.setComponents(data.html);
                if(data.css) editor.setStyle(data.css);
            });

        function saveKioskLayout() {
            fetch('/api/save-layout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ html: editor.getHtml(), css: editor.getCss() })
            })
            .then(res => res.json())
            .then(res => alert(res.message))
            .catch(() => alert('Failed saving canvas adjustments.'));
        }
    </script>
</body>
</html>
