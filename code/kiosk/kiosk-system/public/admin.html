<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Branding</title>
    <style>
        :root { --primary: #25214e; --accent: #b8860b; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f7; color: #222; }
        header { background: var(--primary); color: #fff; padding: 20px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        header p { margin: 4px 0 0; opacity: 0.85; font-size: 14px; }
        main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
        .card { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .hint { font-weight: 400; color: #666; font-size: 12px; margin: -4px 0 8px; }
        input[type=text], textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; font-family: inherit; margin-bottom: 18px; }
        textarea { resize: vertical; min-height: 70px; }
        .color-row { display: flex; gap: 24px; margin-bottom: 18px; flex-wrap: wrap; }
        .color-field { display: flex; align-items: center; gap: 10px; }
        input[type=color] { width: 44px; height: 36px; padding: 0; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
        .logo-row { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
        .logo-preview { width: 64px; height: 64px; border-radius: 8px; border: 1px solid #ddd; object-fit: contain; background: #fafafa; }
        button { background: var(--accent); color: #fff; border: none; padding: 12px 22px; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; }
        button:hover { filter: brightness(0.95); }
        button.secondary { background: #eee; color: #333; padding: 8px 14px; font-size: 13px; }
        #status { margin-top: 14px; font-size: 14px; }
        #status.ok { color: #1a7f37; }
        #status.err { color: #c0392b; }
        a.view-link { color: var(--primary); font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <h1>Kiosk Branding</h1>
        <p>No web design needed — set your logo, colours and welcome message below.</p>
    </header>
    <main>
        <div class="card">
            <label for="storeName">Store name</label>
            <input type="text" id="storeName" maxlength="80">

            <label for="tagline">Tagline <span class="hint">(optional, shown under the store name)</span></label>
            <input type="text" id="tagline" maxlength="140">

            <label>Logo</label>
            <div class="logo-row">
                <img id="logoPreview" class="logo-preview" alt="Logo preview">
                <input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp,image/svg+xml">
            </div>
            <p class="hint">PNG, JPEG, WebP or SVG, up to 2MB.</p>

            <label>Colours</label>
            <div class="color-row">
                <div class="color-field">
                    <input type="color" id="primaryColor">
                    <span>Primary (header, buttons)</span>
                </div>
                <div class="color-field">
                    <input type="color" id="accentColor">
                    <span>Accent (highlights)</span>
                </div>
            </div>

            <label for="welcomeMessage">Boudica AI welcome message</label>
            <textarea id="welcomeMessage" maxlength="300"></textarea>

            <button onclick="saveBranding()">Save Changes</button>
            <div id="status"></div>
        </div>
        <a class="view-link" href="/" target="_blank">View the public kiosk page &rarr;</a>
    </main>

    <script>
        async function loadBranding() {
            const res = await fetch('/api/branding');
            const b = await res.json();
            document.getElementById('storeName').value = b.storeName || '';
            document.getElementById('tagline').value = b.tagline || '';
            document.getElementById('primaryColor').value = b.primaryColor || '#25214e';
            document.getElementById('accentColor').value = b.accentColor || '#b8860b';
            document.getElementById('welcomeMessage').value = b.welcomeMessage || '';
            const preview = document.getElementById('logoPreview');
            preview.src = b.logoUrl || '';
            preview.style.visibility = b.logoUrl ? 'visible' : 'hidden';
        }

        function setStatus(message, ok) {
            const el = document.getElementById('status');
            el.textContent = message;
            el.className = ok ? 'ok' : 'err';
        }

        async function saveBranding() {
            const payload = {
                storeName: document.getElementById('storeName').value,
                tagline: document.getElementById('tagline').value,
                primaryColor: document.getElementById('primaryColor').value,
                accentColor: document.getElementById('accentColor').value,
                welcomeMessage: document.getElementById('welcomeMessage').value
            };

            try {
                const res = await fetch('/api/branding', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Save failed (' + res.status + ')');

                const logoFile = document.getElementById('logoFile').files[0];
                if (logoFile) {
                    const formData = new FormData();
                    formData.append('logo', logoFile);
                    const logoRes = await fetch('/api/branding/logo', { method: 'POST', body: formData });
                    if (!logoRes.ok) {
                        const errBody = await logoRes.json().catch(() => ({}));
                        throw new Error(errBody.message || 'Logo upload failed');
                    }
                }

                setStatus('Saved. Reload the public kiosk page to see the changes.', true);
                await loadBranding();
            } catch (err) {
                setStatus(err.message, false);
            }
        }

        loadBranding();
    </script>
</body>
</html>
