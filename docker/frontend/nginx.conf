server {
    listen 80;
    server_name _;

    # Web store (customer storefront) at the root.
    root /usr/share/nginx/html/web_store;
    index index.html;

    # Till dashboard at /till/.
    location /till/ {
        alias /usr/share/nginx/html/till/;
        index index.html;
        try_files $uri $uri/ /till/index.html;
    }

    # Both frontends call relative /cgi-bin/... paths — proxy straight through to the
    # backend container so no CORS handling is needed for local testing.
    location /cgi-bin/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
